name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: forkroom
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/forkroom
      AUTH_SECRET: ci-placeholder-secret-000000000000000000
      MODEL_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      - name: Lint (Biome)
        run: bun run test:lint

      - name: Types, unit tests, build
        run: node_modules/.bin/turbo test

      - name: Integration tests
        working-directory: apps/web
        run: |
          bun run db:migrate
          bun run test:integration
