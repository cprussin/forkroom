name: Deploy worker

# Deploys the always-on generation worker to Fly.io when a worker-relevant
# change lands on main. The web app deploys separately via Vercel. This runs
# only after a change is merged; main is protected by the CI workflow, so the
# merge commit is already green.
#
# One-time prerequisites (not done here):
#   - the `forkroom-worker` Fly app exists (`flyctl launch --no-deploy
#     --copy-config --config apps/web/fly.toml --name forkroom-worker`)
#   - its secrets are set (DATABASE_URL [direct/session], AUTH_SECRET,
#     MODEL_PROVIDER, MODEL_NAME, ANTHROPIC_API_KEY, SYSTEM_PROMPT)
#   - the repo has a `FLY_API_TOKEN` secret (`flyctl tokens create deploy`)

on:
  push:
    branches: [main]
    paths:
      - apps/web/**
      - packages/**
      - bun.lock
      - .dockerignore
      - .github/workflows/deploy-worker.yml

concurrency:
  group: deploy-worker-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy forkroom-worker to Fly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl deploy . \
            --remote-only \
            --config apps/web/fly.toml \
            --dockerfile apps/web/Dockerfile
